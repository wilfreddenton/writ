[package]
name = "writ"
version = "0.12.0"
description = "A hybrid markdown editor combining raw text editing with live inline rendering"
authors = ["Wilfred Denton <wilfred@hey.com>"]
license = "MIT"
edition = "2024"
repository = "https://github.com/wilfreddenton/writ"
homepage = "https://github.com/wilfreddenton/writ"
documentation = "https://docs.rs/writ"

[lints.clippy]
too_many_arguments = "allow"

[lib]
name = "writ"
path = "src/lib.rs"

[[bin]]
name = "writ"
path = "src/main.rs"

[[bin]]
name = "writd"
path = "src/writd.rs"

[dependencies]
anyhow = "1"
async-compat = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
imara-diff = "0.2"
gix = { version = "0.84", default-features = false, features = ["sha1"] }
gpui = "0.2"
# Provides `application()` = `Application::with_platform(current_platform(..))`,
# which gpui core no longer exposes directly. Pinned to the same rev as the patch.
# The wayland/x11 features gate the Linux windowing backends (gpui_linux); without
# them the platform match falls through to unreachable!() at runtime.
gpui_platform = { git = "https://github.com/wilfreddenton/zed", rev = "52726eee52e9cde291351464a6234eb088b4ce49", features = ["wayland", "x11"] }
notify = "8.2"
open = "5"
regex = "1.12.2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "json"] }
ropey = "1.6"
rustls = { version = "0.23.36", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-highlight = "0.26"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
undo = "0.52"

[profile.release]
lto = "thin"
codegen-units = 1

# Fast release builds for development (cargo build --profile release-fast)
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[dev-dependencies]
rustls = { version = "0.23.36", features = ["ring"] }

# Track the last stable Zed release (v1.8.2) for gpui, plus our orphaned-
# punctuation line-wrapping fix. gpui's version is frozen at 0.2.2 both on
# crates.io and in-tree, so this override satisfies the `gpui = "0.2"` requirement.
# Branch writ-gpui-v1.8.2 = v1.8.2 + the fix; rev pinned for reproducibility.
[patch.crates-io]
gpui = { git = "https://github.com/wilfreddenton/zed", rev = "52726eee52e9cde291351464a6234eb088b4ce49" }
